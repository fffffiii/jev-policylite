name: Review source snapshot
on:
  push:
    branches: [review/docs-and-diagrams-20260923]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Archive tracked source (LFS pointers only)
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: source.tar.gz
          retention-days: 1
          if-no-files-found: error
