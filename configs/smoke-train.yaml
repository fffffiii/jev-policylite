model:
  name_or_path: Qwen/Qwen3.5-0.8B
  trust_remote_code: false
  dtype: bfloat16
  gradient_checkpointing: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
data:
  manifest: data/smoke/train-manifest.jsonl
  image_root: .
  max_length: 1024
  max_pixels: 262144
  num_workers: 0
training:
  output_dir: outputs/smoke-train
  seed: 42
  epochs: 1
  head_warmup_epochs: 0
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  lora_learning_rate: 0.0001
  head_learning_rate: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_every: 1
  eval_every: 1
  early_stopping_patience: 10
