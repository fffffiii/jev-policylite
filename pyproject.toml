[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-policylite"
version = "0.1.0"
description = "Multimodal content moderation with shared task heads and policy-head DPO"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.10,<2",
  "numpy>=1.26,<3",
  "peft>=0.17,<1",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]
web = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "psutil>=7,<8",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qwen35_moderation.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
