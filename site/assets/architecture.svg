<path d="M484 435V495" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M719 566H740V517H765" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M931 517H996V289H1020" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M996 517V476H1020" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M996 517V665H1020" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1020" y="211" width="468" height="160" rx="18" fill="#E8F1F7" stroke="#CCD8DC" stroke-width="1.5"/>
<rect x="1020" y="398" width="468" height="171" rx="18" fill="#E8F1F7" stroke="#CCD8DC" stroke-width="1.5"/>
<rect x="1020" y="596" width="468" height="160" rx="18" fill="#FFF0E2" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="1046" y="252" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">Violation head</text>
<text x="1046" y="291" font-size="22" font-weight="400" fill="#1E3445" text-anchor="start">LayerNorm + Linear → sigmoid</text>
<text x="1046" y="334" font-size="21" font-weight="400" fill="#526775" text-anchor="start">One binary violation score</text>
<text x="1046" y="439" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">Attribute head</text>
<text x="1046" y="478" font-size="22" font-weight="400" fill="#1E3445" text-anchor="start">LayerNorm + Linear → sigmoids</text>
<text x="1046" y="519" font-size="21" font-weight="400" fill="#526775" text-anchor="start">nudity · sexual_act</text>
<text x="1046" y="549" font-size="21" font-weight="400" fill="#526775" text-anchor="start">suggestive · medical</text>
<text x="1046" y="637" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">Policy head</text>
<text x="1046" y="676" font-size="22" font-weight="400" fill="#1E3445" text-anchor="start">LayerNorm + Linear → softmax</text>
<rect x="1046" y="698" width="122" height="34" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="1107.0" y="721" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">block</text>
<rect x="1180" y="698" width="133" height="34" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="1246.5" y="721" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">review</text>
<rect x="1325" y="698" width="136" height="34" rx="8" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="1393.0" y="721" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">allow</text>
<rect x="48" y="803" width="704" height="164" rx="18" fill="#F0F3EA" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="74" y="845" font-size="27" font-weight="600" fill="#1E3445" text-anchor="start">Supervised adaptation</text>
<text x="74" y="882" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Warm up heads, then train language LoRA + heads.</text>
<text x="74" y="914" font-size="21" font-weight="400" fill="#526775" text-anchor="start">The vision encoder stays frozen.</text>
<rect x="779" y="803" width="709" height="164" rx="18" fill="#FFF0E2" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="805" y="845" font-size="27" font-weight="600" fill="#1E3445" text-anchor="start">Preference optimization (DPO)</text>
<text x="805" y="882" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Cache h; freeze backbone, LoRA and other heads.</text>
<text x="805" y="914" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Update the policy head only.</text>
<text x="48" y="1000" font-size="19" font-weight="400" fill="#526775" text-anchor="start">Research prototype. Review and medical-context performance still need dedicated evaluation.</text>
</g></svg>
