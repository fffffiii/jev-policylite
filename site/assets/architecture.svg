<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Jev-PolicyLite architecture</title><desc id="desc">Image features, text and moderation rules pass through Qwen3.5-0.8B with language LoRA. The final hidden state of the last valid token feeds three independent LayerNorm + Linear heads: violation sigmoid, four attribute sigmoids, and a block/review/allow softmax. Only the policy head is updated during DPO; supervised adaptation has a different update scope.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#1E3445"/></marker><marker id="update" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#B85D24"/></marker></defs>
<rect width="1536" height="1024" fill="#FAF9F5"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#1E3445">
<text x="48" y="73" font-size="44" font-weight="700" fill="#1E3445" text-anchor="start">Jev-PolicyLite</text>
<text x="48" y="114" font-size="24" font-weight="400" fill="#526775" text-anchor="start">Image, text and rules → three independent task outputs</text>
<rect x="1080" y="48" width="170" height="34" rx="8" fill="#E8F1F7" stroke="#E8F1F7" stroke-width="1.5"/>
<text x="1165.0" y="71" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">FROZEN IN DPO</text>
<rect x="1265" y="48" width="222" height="34" rx="8" fill="#FFF0E2" stroke="#FFF0E2" stroke-width="1.5"/>
<text x="1376.0" y="71" font-size="16" font-weight="600" fill="#B85D24" text-anchor="middle">UPDATED IN DPO</text>
<text x="48" y="177" font-size="18" font-weight="600" fill="#526775" text-anchor="start">01  INPUTS</text>
<text x="329" y="177" font-size="18" font-weight="600" fill="#526775" text-anchor="start">02  SHARED REPRESENTATION</text>
<text x="1020" y="177" font-size="18" font-weight="600" fill="#526775" text-anchor="start">03  TASK HEADS</text>
<rect x="48" y="214" width="230" height="160" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="73" y="249" font-size="26" font-weight="600" fill="#1E3445" text-anchor="start">Image</text>
<rect x="73" y="269" width="178" height="79" rx="8" fill="#F1F4EE" stroke="#D7E0D4" stroke-width="1.5"/>
<circle cx="213" cy="288" r="10" fill="#E1BD78"/><path d="M75 345L131 284L181 345Z" fill="#9EB8AE"/><path d="M134 345L188 303L247 345Z" fill="#718F88"/>
<rect x="48" y="413" width="230" height="116" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="73" y="453" font-size="26" font-weight="600" fill="#1E3445" text-anchor="start">Text</text>
<text x="73" y="493" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Caption / body</text>
<rect x="48" y="568" width="230" height="116" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="73" y="608" font-size="26" font-weight="600" fill="#1E3445" text-anchor="start">Policy</text>
<text x="73" y="648" font-size="20" font-weight="400" fill="#526775" text-anchor="start">Moderation rules</text>
<rect x="328" y="201" width="648" height="541" rx="18" fill="#E8F1F7" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="366" y="252" font-size="32" font-weight="700" fill="#1E3445" text-anchor="start">Qwen3.5-0.8B</text>
<text x="366" y="283" font-size="20" font-weight="400" fill="#526775" text-anchor="start">Backbone and LoRA are frozen during DPO</text>
<rect x="369" y="321" width="231" height="114" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="392" y="367" font-size="23" font-weight="600" fill="#1E3445" text-anchor="start">Vision encoder</text>
<text x="392" y="402" font-size="20" font-weight="400" fill="#526775" text-anchor="start">Image features</text>
<rect x="369" y="495" width="350" height="177" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="392" y="537" font-size="26" font-weight="600" fill="#1E3445" text-anchor="start">Language backbone</text>
<text x="392" y="575" font-size="19" font-weight="400" fill="#526775" text-anchor="start">Image features + text + rules</text>
<rect x="391" y="602" width="186" height="34" rx="8" fill="#E8F1F7" stroke="#E8F1F7" stroke-width="1.5"/>
<text x="484.0" y="625" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">LANGUAGE LoRA</text>
<rect x="765" y="428" width="166" height="177" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="848" y="467" font-size="25" font-weight="600" fill="#1E3445" text-anchor="middle">Shared h</text>
<text x="848" y="510" font-size="18" font-weight="400" fill="#526775" text-anchor="middle">Last valid</text>
<text x="848" y="537" font-size="18" font-weight="400" fill="#526775" text-anchor="middle">token’s final</text>
<text x="848" y="564" font-size="18" font-weight="400" fill="#526775" text-anchor="middle">hidden state</text>
