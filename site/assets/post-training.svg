<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Policy-head preference optimization</title><desc id="desc">For the same image, text and moderation policy, chosen and rejected are action labels, not generated responses or encoder inputs. Image groups are kept separate between training and validation. Frozen Qwen and LoRA encode each record once. Cached features feed a frozen copy of the starting policy head and a trainable policy head. Both heads’ chosen/rejected probability differences enter a discrete DPO loss. Gradients update only the current policy head. The feature cache exists only for the current process.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#1E3445"/></marker><marker id="update" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#B85D24"/></marker></defs>
<rect width="1536" height="1024" fill="#FAF9F5"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#1E3445">
<text x="48" y="73" font-size="42" font-weight="700" fill="#1E3445" text-anchor="start">Policy-head preference optimization</text>
<text x="48" y="116" font-size="24" font-weight="400" fill="#526775" text-anchor="start">Encode each record once. Use action preferences to update only the policy head.</text>
<rect x="48" y="149" width="178" height="34" rx="8" fill="#E8F1F7" stroke="#E8F1F7" stroke-width="1.5"/>
<text x="137.0" y="172" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">FROZEN MODULE</text>
<rect x="242" y="149" width="198" height="34" rx="8" fill="#FFF0E2" stroke="#FFF0E2" stroke-width="1.5"/>
<text x="341.0" y="172" font-size="16" font-weight="600" fill="#B85D24" text-anchor="middle">TRAINABLE MODULE</text>
<rect x="48" y="225" width="426" height="302" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="74" y="269" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">1  Prepare records</text>
<rect x="73" y="292" width="375" height="58" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="260" y="329" font-size="24" font-weight="600" fill="#1E3445" text-anchor="middle">Image + text + policy</text>
<text x="74" y="385" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Example action pair for the loss:</text>
<rect x="74" y="402" width="176" height="34" rx="8" fill="#F0F3EA" stroke="#F0F3EA" stroke-width="1.5"/>
<text x="162.0" y="425" font-size="16" font-weight="600" fill="#1E3445" text-anchor="middle">chosen: review</text>
<rect x="263" y="402" width="184" height="34" rx="8" fill="#FFF0E2" stroke="#FFF0E2" stroke-width="1.5"/>
<text x="355.0" y="425" font-size="16" font-weight="600" fill="#B85D24" text-anchor="middle">rejected: allow</text>
<text x="74" y="471" font-size="20" font-weight="400" fill="#526775" text-anchor="start">Keep each original-image group</text>
<text x="74" y="499" font-size="20" font-weight="400" fill="#526775" text-anchor="start">in one data split.</text>
<rect x="534" y="225" width="420" height="302" rx="18" fill="#E8F1F7" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="560" y="269" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">2  Encode once</text>
<text x="744" y="340" font-size="27" font-weight="600" fill="#1E3445" text-anchor="middle">Frozen Qwen3.5-0.8B</text>
<text x="744" y="381" font-size="25" font-weight="400" fill="#1E3445" text-anchor="middle">+ language LoRA</text>
<text x="560" y="455" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Select the last valid token’s</text>
<text x="560" y="485" font-size="21" font-weight="400" fill="#526775" text-anchor="start">final hidden state.</text>
<rect x="1014" y="225" width="474" height="302" rx="18" fill="#F6F0D9" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="1040" y="269" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">3  Cache features h</text>
<text x="1040" y="336" font-size="26" font-weight="600" fill="#1E3445" text-anchor="start">One vector per record</text>
<text x="1040" y="386" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Reuse across training epochs.</text>
<text x="1040" y="420" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Cache is held in this process,</text>
<text x="1040" y="454" font-size="21" font-weight="400" fill="#526775" text-anchor="start">not saved as a feature database.</text>
<path d="M448 321H534" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M954 321H1014" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M250 436V446H503V862H720" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="286" y="583" font-size="18" font-weight="600" fill="#526775" text-anchor="start">chosen / rejected</text>
<rect x="48" y="635" width="435" height="150" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="73" y="675" font-size="24" font-weight="600" fill="#1E3445" text-anchor="start">What remains unchanged</text>
<text x="73" y="714" font-size="19" font-weight="400" fill="#526775" text-anchor="start">Backbone, LoRA, violation head,</text>
<text x="73" y="744" font-size="19" font-weight="400" fill="#526775" text-anchor="start">attribute head and reference head.</text>
<path d="M1251 527V584H711V648" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1251 584V648" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="533" y="648" width="356" height="124" rx="18" fill="#E8F1F7" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="559" y="688" font-size="25" font-weight="600" fill="#1E3445" text-anchor="start">Reference policy head</text>
<text x="559" y="724" font-size="19" font-weight="400" fill="#526775" text-anchor="start">Frozen copy of the</text>
<text x="559" y="751" font-size="19" font-weight="400" fill="#526775" text-anchor="start">starting policy head</text>
<rect x="1040" y="648" width="448" height="124" rx="18" fill="#FFF0E2" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="1066" y="688" font-size="27" font-weight="600" fill="#1E3445" text-anchor="start">Current policy head</text>
<text x="1066" y="735" font-size="21" font-weight="400" fill="#B85D24" text-anchor="start">The only trainable module</text>
<rect x="720" y="827" width="482" height="108" rx="18" fill="#FFFFFF" stroke="#CCD8DC" stroke-width="1.5"/>
<text x="747" y="868" font-size="28" font-weight="600" fill="#1E3445" text-anchor="start">Discrete DPO loss</text>
<text x="747" y="907" font-size="20" font-weight="400" fill="#526775" text-anchor="start">Compare chosen / rejected margins</text>
<path d="M711 772V799H827V827" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1174 772V827" fill="none" stroke="#1E3445" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1202 881H1400V791H1263V772" fill="none" stroke="#B85D24" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#update)"/>
<text x="1242" y="916" font-size="18" font-weight="600" fill="#B85D24" text-anchor="start">Gradient: policy head only</text>
<text x="48" y="973" font-size="21" font-weight="400" fill="#526775" text-anchor="start">Save adapter + processor + task heads; evaluate on held-out data before use.</text>
<text x="48" y="1006" font-size="19" font-weight="400" fill="#526775" text-anchor="start">The base model is still required. No online rollout, PPO or GRPO is implemented.</text>
</g></svg>
